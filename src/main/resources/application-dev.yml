spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    ignore-migration-patterns: "*:missing"
    validate-on-migrate: false
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:geo_analytics}"
    user: "${FLYWAY_USER:postgres}"
    password: "${FLYWAY_PASSWORD:}"
  datasource:
    api:
      jdbc-url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:geo_analytics}"
      username: "${API_WORKER_USER:api_worker}"
      password: "${API_WORKER_PASSWORD}"
    batch:
      jdbc-url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:geo_analytics}"
      username: "${BATCH_WORKER_USER:batch_worker}"
      password: "${BATCH_WORKER_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      "[hibernate.format_sql]": false
    show-sql: false
    open-in-view: false
  # Why: 既定は開発用の受信箱 Mailpit（bash scripts/mail.sh up）。.env に MAIL_* を書けば Gmail 等へ実際に送る。
  #      切り替えは送信先だけで、ログイン画面の表示は変わらない。
  mail:
    host: "${MAIL_HOST:localhost}"
    port: "${MAIL_PORT:1025}"
    username: "${MAIL_USERNAME:}"
    password: "${MAIL_PASSWORD:}"
    default-encoding: UTF-8
    properties:
      # Why: Gmail(587) は STARTTLS で暗号化する。Mailpit は STARTTLS を提示しないので、有効化だけして必須にはしない。
      "[mail.smtp.starttls.enable]": true
      # Why: JavaMail の既定タイムアウトは無限。送信先が固まると送信スレッドが戻らない。
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

server:
  address: 127.0.0.1
  port: 8080

logging:
  level:
    com.geo.analytics: DEBUG
    org.springframework.security: DEBUG

app:
  bootstrap:
    # Why: 開発で自分の Gmail にログインコードを届けるため、初期ユーザーのアドレスを .env で差し替えられるようにする。
    #      .env は自動テストにも読み込まれるため、テストが拾わないようここ（開発）でだけ環境変数を読む。
    email: "${APP_BOOTSTRAP_EMAIL:bootstrap@example.com}"
