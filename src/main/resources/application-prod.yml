spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    url: "jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:geo_analytics}"
    username: "${DB_USER:postgres}"
    password: "${DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      "[hibernate.format_sql]": false
    show-sql: false
    open-in-view: false
  # Why: 既定の送信先を持たせない。未設定なら MailSettingsStartupCheck が起動を止める（ログインコードを送れないため）。
  mail:
    host: "${MAIL_HOST:}"
    port: "${MAIL_PORT:587}"
    username: "${MAIL_USERNAME:}"
    password: "${MAIL_PASSWORD:}"
    default-encoding: UTF-8
    properties:
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      # Why: JavaMail の既定タイムアウトは無限。送信先が固まると送信スレッドが戻らない。
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

app:
  security:
    max-sessions-per-user: 1
    jwt:
      secret: "${JWT_SECRET}"
      access-token-expiration-sec: 900
      refresh-token-expiration-sec: 2592000
      cookie-secure: true
    rls:
      enabled: true
      postgres-session-parameter: app.current_tenant
      enforce-appi-2026: true
